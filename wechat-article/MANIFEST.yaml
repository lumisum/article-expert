beneva_skill:
  version: 42
  id: wechat-article
  type: workflow
  execution_mode: phased
  phase_order: strict
  topic_scan_workspace: "${REAL_USER_HOME}/wechat_articles/topic_scans/[scan_id]"
  topic_workspace: "${REAL_USER_HOME}/wechat_articles/topics/[topic_id]"

  phases:
    - id: stage0_topic_candidates
      instructions_ref: references/stage0.md
      inputs: []
      outputs:
        - research/topic_candidates.json
        - research/topic_candidates.md
        - research/raw_pages/
      scripts:
        - scripts/cdp_capture_pages.py
        - scripts/validate_topic_candidates.py
      user_confirmation_after: true

    - id: stage1_observation
      instructions_ref: references/stage1.md
      inputs:
        - confirmed_topic_or_url
      outputs:
        - research/research_blueprint.json
        - research/raw_pages/
        - research/source_pack.json
        - research/stage1_receipt.json
      scripts:
        - scripts/validate_research_blueprint.py
        - scripts/cdp_capture_pages.py
        - scripts/validate_research_outputs.py

    - id: stage2_mechanism
      instructions_ref: references/stage2.md
      inputs:
        - research/stage1_receipt.json
        - research/source_pack.json
        - research/raw_pages/
        - references/author.md
      outputs:
        - research/raw_pages/
        - research/source_pack.json
        - article/article_mindmap.md
        - article/stage2_receipt.json
      scripts:
        - scripts/cdp_capture_pages.py
        - scripts/validate_mindmap_outputs.py

    - id: stage3_insight
      instructions_ref: references/stage3.md
      inputs:
        - research/stage1_receipt.json
        - article/stage2_receipt.json
        - research/source_pack.json
        - research/raw_pages/
        - article/article_mindmap.md
        - references/author.md
      outputs:
        - research/raw_pages/
        - research/source_pack.json
        - article/stage3_receipt.json
      scripts:
        - scripts/cdp_capture_pages.py
        - scripts/validate_insight_outputs.py

    - id: stage4_article
      instructions_ref: references/stage4.md
      inputs:
        - research/stage1_receipt.json
        - article/stage2_receipt.json
        - article/stage3_receipt.json
        - research/source_pack.json
        - research/raw_pages/
        - article/article_mindmap.md
        - references/author.md
      outputs:
        - article/final_article.md
        - article/final_article_copy.html
      scripts:
        - scripts/markdown_to_wechat_html.py
        - scripts/validate_final_outputs.py

    - id: stage5_images
      instructions_ref: references/stage5.md
      inputs:
        - research/source_pack.json
        - article/stage3_receipt.json
        - article/final_article.md
        - article/final_article_copy.html
      outputs:
        - article/final_article.md
        - article/final_article_copy.html
        - assets/image_prompts.jsonl
      scripts:
        - scripts/markdown_to_wechat_html.py
        - scripts/validate_image_outputs.py

    - id: stage6_title_cover
      instructions_ref: references/stage6.md
      inputs:
        - research/source_pack.json
        - article/stage3_receipt.json
        - article/final_article.md
        - article/final_article_copy.html
        - assets/image_prompts.jsonl
      outputs:
        - assets/title_cover_package.json
        - article/final_article_digest.txt
      scripts:
        - scripts/markdown_to_wechat_html.py
        - scripts/validate_title_cover_outputs.py

    - id: stage7_talking_script
      required: false
      instructions_ref: references/stage7.md
      inputs:
        - research/source_pack.json
        - article/stage3_receipt.json
        - research/raw_pages/
        - references/author.md
      outputs:
        - video/talking_script.txt
      scripts:
        - scripts/validate_talking_script.py

  optional_modes:
    - id: question_revision
      repeatable: true
      user_driven: true
      instructions_ref: references/question_revision.md
      inputs:
        - research/source_pack.json
        - research/raw_pages/
        - article/article_mindmap.md
        - article/final_article.md
        - references/author.md
      outputs:
        - research/raw_pages/
        - research/source_pack.json
        - article/final_article.md
        - article/final_article_copy.html
      scripts:
        - scripts/cdp_capture_pages.py
        - scripts/markdown_to_wechat_html.py
        - scripts/validate_final_outputs.py
