novel_expert_skill:
  version: 22
  id: novel-expert
  type: workflow
  execution_mode: phased
  phase_order: strict
  topic_workspace: "${REAL_USER_HOME}/wechat_articles/topics/[topic_id]"
  lead_cast_ref: references/cast-bible.json
  phases:
    - id: stage0_topic
      instructions_ref: references/stage0.md
      validator: "scripts/validate_stage.py --stage 0"
    - id: stage1_observation
      instructions_ref: references/stage1.md
      validator: "scripts/validate_stage.py --stage 1"
    - id: stage2_action_arc
      instructions_ref: references/stage2.md
      validator: "scripts/validate_stage.py --stage 2"
    - id: stage3_novel_audit
      instructions_ref: references/stage3.md
      validator: "scripts/validate_stage.py --stage 3"
    - id: stage4_article
      instructions_ref: references/stage4.md
      validator: "scripts/validate_stage.py --stage 4"
    - id: stage5_images
      instructions_ref: references/stage5.md
      validator: "scripts/validate_stage.py --stage 5"
    - id: stage6_title_cover
      instructions_ref: references/stage6.md
      validator: "scripts/validate_stage.py --stage 6"
    - id: stage7_image_narration_audio
      required: false
      instructions_ref: references/stage7.md
      validator: "scripts/validate_stage.py --stage 7"
